# Publishes to npm from the public mirror, so npm can attest provenance: the attestation links the tarball to
# this public commit and this workflow run. npm refuses provenance when the source repository is private, which
# is why publishing moved here (#56).
#
# Idempotent by design: it publishes a package only when its version is not on the registry yet. While the private
# monorepo still publishes, every version is already there by the time this runs, so this workflow does nothing and
# stays green. That is what makes it safe to install before the trusted publisher exists.
#
# Kept in the private monorepo under .github/mirror/ and copied by mirror.yml; do not edit it in the mirror.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  id-token: write # npm trusted publishing mints its token from this; there is no npm token anywhere

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No registry-url: setup-node would write an .npmrc with a placeholder NODE_AUTH_TOKEN that npm sends
      # instead of minting an OIDC token, and the registry answers 404 to that.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish the packages whose version is not on npm yet
        run: |
          set -euo pipefail
          published=0
          # Enumerated from the workspace, never written out here: a hand-written list only publishes what
          # somebody remembered to put in it, and on 2026-09-11 that was `@downtrace/mcp`, versioned to
          # 0.1.0 by changesets and published by nobody, with both workflows green (gh-416). `private` is
          # the same mark pnpm and changesets already read, so the three agree by construction.
          for dir in $(node -e '
            const fs = require("node:fs");
            for (const name of fs.readdirSync("packages")) {
              const path = `packages/${name}/package.json`;
              if (!fs.existsSync(path)) continue;
              if (JSON.parse(fs.readFileSync(path, "utf8")).private) continue;
              console.log(`packages/${name}`);
            }
          '); do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, nothing to do"
              continue
            fi
            echo "publishing $name@$version"
            pnpm --filter "$name" run build
            # `pnpm pack` applies publishConfig, which is what rewrites exports to dist/; plain `npm publish` does
            # not, and would ship a package pointing at sources that are not in the tarball. npm then does the
            # publishing, because that is what mints the OIDC token and the provenance attestation.
            tgz=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
            npm publish "$tgz" --provenance --access public
            published=$((published + 1))
          done
          echo "published $published package(s)"
      # The MCP Registry lists `@downtrace/mcp` by `packages/mcp/server.json`, once npm has the version it names: the
      # registry fetches that version from npm and refuses it unless its `mcpName` is the listing's name. Idempotent
      # as the step above: nothing is done for a version the registry already has. GitHub's OIDC token proves the
      # namespace `io.github.RadW2020/`, so there is no registry token anywhere either.
      - name: List the MCP server's version on the MCP Registry when it is not there yet
        run: |
          set -euo pipefail
          name=$(node -p "require('./packages/mcp/server.json').name")
          version=$(node -p "require('./packages/mcp/server.json').version")
          listed=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://registry.modelcontextprotocol.io/v0.1/servers/$(node -p 'encodeURIComponent(process.argv[1])' "$name")/versions/$version")
          if [ "$listed" = 200 ]; then
            echo "$name $version is already on the MCP Registry, nothing to do"
            exit 0
          fi
          # Waited for: the step above has just published it, and npm serves a new version a while after it takes
          # it. Asked once, on 2026-10-29, it answered nothing for 0.3.1 seconds after the publish, and the listing
          # was skipped with the run green. The registry asks npm too, so it is not asked before npm answers.
          carried=""
          for attempt in $(seq 1 18); do
            carried=$(npm view "@downtrace/mcp@$version" mcpName 2>/dev/null || true)
            [ -n "$carried" ] && break
            sleep 10
          done
          if [ "$carried" != "$name" ]; then
            echo "@downtrace/mcp@$version on npm carries the mcpName '$carried', not $name; the registry would refuse it"
            exit 0
          fi
          # Pinned and checked: a binary fetched by a workflow that holds an OIDC token runs as this repository.
          curl -sfL --max-time 60 -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish packages/mcp/server.json
