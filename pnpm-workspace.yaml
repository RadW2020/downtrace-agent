packages:
  - packages/*
# Jest 30's, which the agent's tests run Jest with: both fall back to a build only when no prebuilt binary fits, and
# a dependency of a test runs no install script here.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
  # The agent's tests observe SQLite through it, and it builds its native addon in an install script: it fetches a
  # prebuilt binary, and compiles only when none fits.
  better-sqlite3: true
  # And through node-sqlite3, the callback driver Knex and Sequelize open SQLite with, which also fetches a prebuilt
  # addon in an install script and compiles only when none fits.
  sqlite3: true
  # The agent's tests observe Prisma 4 to 6 through its engine, which it downloads in an install script, for the
  # platform, from Prisma's CDN: the tests then generate their clients with no network. The client's and the CLI's
  # own scripts generate a client nobody asked for and check versions, and are not needed.
  '@prisma/engines': true
  '@prisma/client': false
  prisma: false
