packages:
  - packages/*
# Jest 30's, which the agent's tests run Jest with: both fall back to a build only when no prebuilt binary fits, and
# a dependency of a test runs no install script here.
allowBuilds:
  '@parcel/watcher': false
  unrs-resolver: false
  # The agent's tests observe SQLite through it, and it builds its native addon in an install script: it fetches a
  # prebuilt binary, and compiles only when none fits.
  better-sqlite3: true
