services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: downtrace
      POSTGRES_PASSWORD: downtrace
      POSTGRES_DB: downtrace
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U downtrace -d downtrace"]
      interval: 2s
      timeout: 2s
      retries: 15
  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
