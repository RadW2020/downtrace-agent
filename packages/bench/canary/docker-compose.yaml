# The canary: a reference app that reports to a cloud, steady traffic through it, and the door that switches one
# regression on, waits for the finding and its recovery, and answers whether the cloud saw what it should
# (README of the bench, «The canary»). Nothing here has a public port.
#
# The network is no fence: where it is deployed, Coolify puts every service of the stack on the network all its
# stacks share, whatever this file says, so `/__admin` of the reference app asks for its token (ADMIN_TOKEN) and the
# services carry names no other stack there uses — a shared `postgres` would be a second stack's database answering
# to this one. The scheduler calls the door by its service's name, `downtrace-canary`.
#
# What it reads from the environment, set where it is deployed. Plain `${VAR}` and not `${VAR:?}`: where it is
# deployed the image is built with the build-time variables only, and these are not build-time, so a required one
# would stop the build. A missing one stops the start instead: the canary exits 2 without its URL, project or
# credential, Postgres does not start without its password, and the reference app without its ingest token sends
# nothing, which the canary reads as a night it cannot measure.
#   DOWNTRACE_URL      the cloud the reference app reports to and the canary asks
#   DOWNTRACE_TOKEN    the ingest token of the canary's project
#   CANARY_PROJECT     the slug of the canary's project
#   CANARY_TOKEN       an access credential of the same project, level read
#   CANARY_APP_TOKEN   what the reference app's /__admin asks for
#   POSTGRES_PASSWORD  the reference app's own database
x-image: &image
  build:
    context: ../../..
    dockerfile: packages/bench/canary/Dockerfile

services:
  canary-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: canary
    volumes:
      - canary-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d canary"]
      interval: 5s
      timeout: 3s
      retries: 20

  canary-redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  canary-app:
    <<: *image
    working_dir: /srv/packages/reference-app
    command: ["node", "--import", "@downtrace/agent/register", "src/main.ts"]
    environment:
      DATABASE_URL: postgres://canary:${POSTGRES_PASSWORD}@canary-postgres:5432/canary
      REDIS_URL: redis://canary-redis:6379
      HOST: 0.0.0.0
      ADMIN_ENABLED: "1"
      ADMIN_TOKEN: ${CANARY_APP_TOKEN}
      APP_VERSION: ${SOURCE_COMMIT:-unknown}
      DOWNTRACE_URL: ${DOWNTRACE_URL}
      DOWNTRACE_TOKEN: ${DOWNTRACE_TOKEN}
    depends_on:
      canary-postgres:
        condition: service_healthy
      canary-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  # Steady traffic, so the detector always has a reference: about three requests a second, one checkout in ten,
  # which keeps a five-minute window of checkouts well above the fifty the rule asks for. An hour per run, each
  # with its own seed; a run whose requests failed (a regression is on) exits 1 and the next one starts anyway.
  canary-load:
    <<: *image
    working_dir: /srv/packages/bench
    command:
      - sh
      - -c
      - while true; do node src/load-cli.ts --url http://canary-app:4000 --rps 3 --duration 3600 --seed "$$(date +%s)" || sleep 5; done
    depends_on:
      canary-app:
        condition: service_healthy

  downtrace-canary:
    <<: *image
    working_dir: /srv/packages/bench
    command: ["node", "src/canary-cli.ts"]
    environment:
      CANARY_APP_URL: http://canary-app:4000
      CANARY_APP_TOKEN: ${CANARY_APP_TOKEN}
      CANARY_CLOUD_URL: ${DOWNTRACE_URL}
      CANARY_PROJECT: ${CANARY_PROJECT}
      CANARY_TOKEN: ${CANARY_TOKEN}
    depends_on:
      canary-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  canary-postgres:
